<!DOCTYPE html>
<html lang="en-US">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Contact Us | Wild River Rafting</title>
    <meta name="description" content="Contact Wild River Rafting to ask a question, book a river trip, or share feedback. Find our address, phone number, email, map, and meet the team.">
    <meta name="author" content="Emmanuel Iwu">
    <link rel="stylesheet" href="styles/rafting.css">
  </head>
  <body>
    <header>
      <img src="images/logo.svg" alt="Wild River Rafting logo">
      <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About Us</a>
        <a href="trips.html">Trips</a>
        <a href="contact.html">Contact Us</a>
      </nav>
    </header>
    <main>
      <section class="contact-intro">
        <h1>Contact Wild River Rafting</h1>
        <address>
          123 Main River Street<br>
          Kernville, California<br>
          Phone: <a href="tel:+19999999999">+1 999 999 9999</a><br>
          Email: <a href="mailto:info@wildriverrafting.com">info@wildriverrafting.com</a>
        </address>
      </section>
      <section class="contact-layout">
        <iframe title="Map showing the Wild River Rafting office in Kernville, California" src="https://maps.google.com/maps?q=Kernville,+California&amp;output=embed" width="400" height="360" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
        <form action="#" method="get">
          <div class="field">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" placeholder="Your full name" required>
          </div>
          <div class="field">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="you@example.com" required>
          </div>
          <fieldset>
            <legend>Message Purpose</legend>
            <div class="choice">
              <input type="radio" id="general" name="purpose" value="general" checked>
              <label for="general">General Inquiry</label>
            </div>
            <div class="choice">
              <input type="radio" id="reservation" name="purpose" value="reservation">
              <label for="reservation">Reservation Question</label>
            </div>
            <div class="choice">
              <input type="radio" id="suggestion" name="purpose" value="suggestion">
              <label for="suggestion">Website Suggestion</label>
            </div>
          </fieldset>
          <div class="field">
            <label for="message">Message</label>
            <textarea id="message" name="message" rows="5" placeholder="Type here" required></textarea>
          </div>
          <div class="choice">
            <input type="checkbox" id="newsletter" name="newsletter" value="yes">
            <label for="newsletter">Please subscribe me to the monthly newsletter</label>
          </div>
          <button type="submit">Get in Touch!</button>
        </form>
      </section>
      <section class="team">
        <h2>We Are Here to Serve You</h2>
        <figure>
          <img src="images/employee-1.svg" alt="Portrait of Alex Rivera, wearing a helmet">
          <figcaption>Alex Rivera<br>Head River Guide</figcaption>
        </figure>
        <figure>
          <img src="images/employee-2.svg" alt="Portrait of Maria Santos, wearing a helmet">
          <figcaption>Maria Santos<br>Reservations Manager</figcaption>
        </figure>
        <figure>
          <img src="images/employee-3.svg" alt="Portrait of Sam Okafor, wearing a helmet">
          <figcaption>Sam Okafor<br>Safety Coordinator</figcaption>
        </figure>
      </section>
    </main>
    <footer>
      <p>&copy;2026 Wild River Rafting &#10070; Emmanuel Iwu</p>
      <nav class="socialmedia">
        <a href="https://facebook.com">
          <img src="images/facebook.svg" alt="Facebook Icon">
        </a>
        <a href="https://linkedin.com">
          <img src="images/linkedin.svg" alt="LinkedIn Icon">
        </a>
        <a href="https://instagram.com">
          <img src="images/instagram.svg" alt="Instagram Icon">
        </a>
      </nav>
    </footer>
  </body>
</html>
